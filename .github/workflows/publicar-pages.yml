name: Publicar AfinidadeSeletivas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Montar site
        run: python tools/build_site.py

      - name: Aplicar decisões editoriais históricas
        run: python tools/apply_editorial_overrides.py

      - name: Inserir Cloudflare Web Analytics
        run: python tools/inject_cloudflare_analytics.py

      - name: Validar links e arquivos locais
        run: python tools/validate_site.py

      - name: Configurar GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Preparar artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
